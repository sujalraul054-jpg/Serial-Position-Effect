# Hosting platforms usually provide the port in the PORT environment variable.
server.port=${PORT:8080}

# H2 database, stored in DATA_DIR (default ./data) so results persist between runs.
# When deployed, DATA_DIR must point at storage that survives restarts.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/serialpositiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created from the entity classes. Replace with a migration tool
# (e.g. Flyway) before moving to MySQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Database console at /h2-console. Set H2_CONSOLE=false on any server that others can reach:
# the console gives full access to the data.
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
